</button>
</footer>
<script>
        function setAmount(val) {
            const input = document.getElementById('amount-input');
            input.value = val;
            
            // Visual feedback on active chip
            const chips = document.querySelectorAll('.flex.gap-sm.overflow-x-auto button');
            chips.forEach(chip => {
                if(chip.innerText.includes(val.toLocaleString())) {
                    chip.classList.add('bg-primary', 'text-white');
                    chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
                } else {
                    chip.classList.remove('bg-primary', 'text-white');
                    chip.classList.add('bg-surface-container', 'text-on-surface-variant');
                }
            });
        }

        // Add small ripple or interaction effects
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const x = e.clientX - e.target.offsetLeft;
                const y = e.clientY - e.target.offsetTop;
