<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .scanning-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #59df89, transparent);
            box-shadow: 0 0 15px #59df89;
            animation: scan 2.5s ease-in-out infinite;
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .reticle-corner {
            width: 32px;
            height: 32px;
            border-color: #77fca3;
        }
        .glass-panel {
            background: rgba(25, 28, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "security-crimson-surface": "#FEE2E2",
                        "secondary-container": "#d9dff5",
                        "tertiary": "#0053db",
                        "secondary": "#575e70",
                        "on-surface": "#191c1e",
                        "on-primary-container": "#003317",
                        "secondary-fixed": "#dce2f7",
                        "primary-fixed-dim": "#59df89",
                        "on-background": "#191c1e",
                        "trust-amber": "#F59E0B",
                        "on-primary-fixed-variant": "#005228",
                        "on-tertiary": "#ffffff",
                        "primary": "#006d38",
                        "canvas-pure": "#FFFFFF",
                        "surface-dim": "#d9dadc",
                        "background": "#f8f9fb",
                        "on-surface-variant": "#3d4a3f",
                        "inverse-surface": "#2e3132",
                        "surface": "#f8f9fb",
                        "on-tertiary-container": "#00256c",
                        "secondary-fixed-dim": "#c0c6db",
                        "surface-tint": "#006d38",
                        "security-crimson": "#EF4444",
                        "outline": "#6d7b6e",
                        "surface-variant": "#e1e2e4",
                        "trust-amber-surface": "#FEF3C7",
                        "on-secondary-fixed": "#141b2b",
                        "on-tertiary-fixed": "#00174b",
                        "primary-container": "#00a859",
                        "tertiary-container": "#638cff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#77fca3",
                        "on-secondary-fixed-variant": "#404758",
                        "outline-variant": "#bccabc",
                        "tertiary-fixed-dim": "#b4c5ff",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f0f1f3",
                        "on-secondary-container": "#5c6274",
                        "on-tertiary-fixed-variant": "#003ea8",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e1e2e4",
                        "on-primary-fixed": "#00210d",
                        "surface-container-high": "#e7e8ea",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#dbe1ff",
                        "inverse-primary": "#59df89",
                        "surface-bright": "#f8f9fb",
                        "text-muted": "#4B5563",
                        "surface-container": "#edeef0",
                        "surface-container-low": "#f3f4f6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "touch-target-min": "48px",
                        "sm": "8px",
                        "unit": "4px",
                        "gutter-mobile": "16px",
                        "touch-target-primary": "52px",
                        "lg": "24px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-bold": ["Inter"],
                        "price-display": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "body-base": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-bold": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "600"}],
                        "price-display": ["20px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "800"}],
                        "display-lg-mobile": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-base": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}],
                        "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface overflow-hidden font-body-base">
<!-- Top App Bar -->
<header class="bg-surface dark:bg-on-surface border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-touch-target-primary w-full fixed top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">security</span>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed">Customs Authority</h1>
</div>
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform p-2 rounded-full hover:bg-surface-variant text-on-surface-variant">
<span class="material-symbols-outlined">verified_user</span>
</button>
</div>
</header>
<!-- Main Scanning Canvas -->
<main class="relative w-full h-screen">
<!-- Camera Viewport Placeholder -->
<div class="absolute inset-0 z-0">
<img alt="Camera View" class="w-full h-full object-cover grayscale-[20%] brightness-[60%]" data-alt="A first-person perspective of a professional camera viewfinder focused on a modern shipping container terminal at sunset. The lighting is dramatic and moody, with high-contrast shadows and golden highlights reflecting off metal surfaces. The aesthetic is industrial and high-trust, utilizing a muted palette of steel blues and warm oranges. The image is crisp and detailed, suggesting a high-performance surveillance or inspection tool in action." src="https://lh3.googleusercontent.com/aida-public/AB6AXuArq-LPuaZfdV_vVOLiZZ3vRSqSV4jqEbCZhQO6fmNcyKpbg4mxOHaHC738PL3B31OcwLxuGO_eibwd93sq_ibtBvL1AFrA6Q9K5x_aqcYzhTHcp2aETFadX9RreQld6FeyWdPIRF55NS4xr8kC56ozq8S4HSFFor24WY7hS5R6plFN6lbAOU2knFrtd9CdD7JpnbbjQXE_UG-ZIXl793hGBZpH0J6nOo8fNBE92nDTvfWdrZsoGZ8QJTF7KHBGC7-9vspEYD2lsHAW"/>
</div>
<!-- Overlays -->
<div class="absolute inset-0 flex flex-col items-center justify-center z-10">
<!-- Scanning Reticle -->
<div class="relative w-64 h-64 md:w-80 md:h-80">
<!-- Corners -->
<div class="absolute top-0 left-0 reticle-corner border-t-4 border-l-4 rounded-tl-xl"></div>
<div class="absolute top-0 right-0 reticle-corner border-t-4 border-r-4 rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 reticle-corner border-b-4 border-l-4 rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 reticle-corner border-b-4 border-r-4 rounded-br-xl"></div>
<!-- Animated Line -->
<div class="absolute left-0 w-full scanning-line opacity-80"></div>
<!-- Center Target -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-2 h-2 bg-primary-fixed rounded-full shadow-[0_0_10px_#77fca3]"></div>
</div>
</div>
<!-- Instruction Text -->
<div class="mt-8 px-6 py-3 glass-panel rounded-full border border-outline-variant/30 text-white flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed">info</span>
<p class="font-body-bold text-body-bold">Scan Manifest ID or Vehicle Plate</p>
</div>
</div>
<!-- Quick Controls -->
<div class="absolute top-24 right-4 flex flex-col gap-4 z-20">
<button class="w-12 h-12 glass-panel rounded-full flex items-center justify-center text-white active:scale-90 transition-all border border-outline-variant/20" title="Toggle Flashlight">
<span class="material-symbols-outlined">flashlight_on</span>
</button>
<button class="w-12 h-12 glass-panel rounded-full flex items-center justify-center text-white active:scale-90 transition-all border border-outline-variant/20" title="Manual Entry">
<span class="material-symbols-outlined">keyboard</span>
</button>
</div>
<!-- Scanning Confirmation Toast (Animated via JS logic simulation) -->
<div class="absolute bottom-24 left-1/2 -translate-x-1/2 z-30 w-[calc(100%-32px)] max-w-md transform translate-y-20 transition-all duration-500 ease-out opacity-0" id="scan-toast">
<div class="bg-inverse-surface text-inverse-on-surface px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 border-l-4 border-primary">
<div class="flex-shrink-0 w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<div class="flex-grow">
<h4 class="font-body-bold text-body-bold text-white">Vehicle LAG-102-XJ Detected</h4>
<p class="text-sm opacity-80">Loading Manifest...</p>
</div>
<div class="animate-spin h-5 w-5 border-2 border-primary-fixed border-t-transparent rounded-full"></div>
</div>
</div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter-mobile pb-safe bg-surface dark:bg-inverse-surface border-t border-outline-variant dark:border-outline shadow-lg h-16">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-fixed-variant text-on-primary-container dark:text-on-primary-fixed rounded-xl px-4 py-1 active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-label-caps text-label-caps">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-caps text-label-caps">Manifests</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<script>
        // Micro-interaction: Trigger toast after 2 seconds to simulate a scan
        window.addEventListener('DOMContentLoaded', () => {
            const toast = document.getElementById('scan-toast');
            setTimeout(() => {
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            }, 2500);
        });

        // Toggle Active State simulation
        const navItems = document.querySelectorAll('nav a');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                navItems.forEach(nav => {
                    nav.className = "flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant active:scale-90 transition-all duration-150";
                    const icon = nav.querySelector('.material-symbols-outlined');
                    if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                item.className = "flex flex-col items-center justify-center bg-primary-container dark:bg-primary-fixed-variant text-on-primary-container dark:text-on-primary-fixed rounded-xl px-4 py-1 active:scale-90 transition-all duration-150";
                const activeIcon = item.querySelector('.material-symbols-outlined');
                if(activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
</body></html>
