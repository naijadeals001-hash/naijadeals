<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bill Payment Confirmation - NaijaUtilities</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error": "#ffffff",
                      "on-primary-container": "#80bea6",
                      "on-tertiary-fixed": "#002114",
                      "on-surface": "#0b1c30",
                      "on-tertiary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "inverse-surface": "#213145",
                      "outline-variant": "#bfc9c3",
                      "primary-fixed-dim": "#95d3ba",
                      "tertiary": "#003623",
                      "error": "#ba1a1a",
                      "surface-variant": "#d3e4fe",
                      "secondary-container": "#d5e3fd",
                      "on-primary-fixed-variant": "#0b513d",
                      "secondary": "#515f74",
                      "on-secondary-fixed": "#0d1c2f",
                      "on-tertiary-container": "#51c695",
                      "surface-container-highest": "#d3e4fe",
                      "primary-container": "#064e3b",
                      "tertiary-container": "#004f35",
                      "primary-fixed": "#b0f0d6",
                      "on-primary": "#ffffff",
                      "surface": "#f8f9ff",
                      "on-primary-fixed": "#002117",
                      "surface-container-high": "#dce9ff",
                      "on-secondary-container": "#57657b",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed": "#d5e3fd",
                      "on-background": "#0b1c30",
                      "outline": "#707974",
                      "primary": "#003527",
                      "on-surface-variant": "#404944",
                      "surface-dim": "#cbdbf5",
                      "on-tertiary-fixed-variant": "#005137",
                      "tertiary-fixed": "#85f8c4",
                      "secondary-fixed-dim": "#b9c7e0",
                      "error-container": "#ffdad6",
                      "inverse-on-surface": "#eaf1ff",
                      "surface-bright": "#f8f9ff",
                      "on-secondary-fixed-variant": "#3a485c",
                      "on-error-container": "#93000a",
                      "background": "#f8f9ff",
                      "surface-container-low": "#eff4ff",
                      "surface-container": "#e5eeff",
                      "surface-tint": "#2b6954",
                      "tertiary-fixed-dim": "#68dba9",
                      "inverse-primary": "#95d3ba"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "gutter": "24px",
                      "container-max": "1440px",
                      "margin-mobile": "16px",
                      "unit": "4px",
                      "margin-desktop": "40px"
              },
              "fontFamily": {
                      "headline-md": ["Plus Jakarta Sans"],
                      "body-md": ["Plus Jakarta Sans"],
                      "body-lg": ["Plus Jakarta Sans"],
                      "label-sm": ["JetBrains Mono"],
                      "headline-lg-mobile": ["Plus Jakarta Sans"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "display-lg": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                      "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .animate-scale-in {
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-bg {
            background: radial-gradient(circle at top, theme('colors.primary-fixed'), theme('colors.background') 60%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased success-bg">
<!-- Top App Bar (Modified for transactional view - hidden on mobile, present on web) -->
<header class="hidden md:flex justify-between items-center px-margin-desktop py-4 bg-canvas-pure w-full max-w-container-max mx-auto flat no shadows">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer">grid_view</span>
<span class="font-display-lg text-primary tracking-tight">NaijaDeals</span>
</div>
<div>
<span class="material-symbols-outlined text-primary cursor-pointer">notifications</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-md mx-auto">
<!-- Animated Success Icon -->
<div class="mb-8 animate-scale-in flex flex-col items-center">
<div class="w-24 h-24 bg-primary-container rounded-full flex items-center justify-center shadow-lg mb-4">
<span class="material-symbols-outlined text-on-primary-container text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-primary text-center">Payment Successful</h1>
<p class="text-secondary text-center mt-2 font-body-md">Your transaction has been processed.</p>
</div>
<!-- Receipt Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 w-full shadow-sm mb-8 relative overflow-hidden">
<!-- Decorative corner cutout effect -->
<div class="absolute -left-3 top-1/2 w-6 h-6 bg-background rounded-full transform -translate-y-1/2 border-r border-outline-variant z-10"></div>
<div class="absolute -right-3 top-1/2 w-6 h-6 bg-background rounded-full transform -translate-y-1/2 border-l border-outline-variant z-10"></div>
<!-- Dashed divider -->
<div class="absolute left-0 top-1/2 w-full border-t border-dashed border-outline-variant"></div>
<div class="flex flex-col gap-4 pb-6">
<div class="flex justify-between items-center">
<span class="text-secondary font-body-md">Amount Paid</span>
<span class="font-headline-md text-on-surface">₦15,000.00</span>
</div>
<div class="flex justify-between items-center">
<span class="text-secondary font-body-md">Provider</span>
<span class="font-body-lg text-on-surface">Ikeja Electric (Prepaid)</span>
</div>
</div>
<div class="flex flex-col gap-4 pt-6">
<div class="flex justify-between items-center">
<span class="text-secondary font-body-md">Meter Number</span>
<span class="font-label-sm text-on-surface uppercase">01020304050</span>
</div>
<div class="flex justify-between items-center">
<span class="text-secondary font-body-md">Transaction ID</span>
<span class="font-label-sm text-on-surface uppercase">TXN-84729-NJD</span>
</div>
<!-- High Priority Token Area -->
<div class="mt-4 bg-surface p-4 rounded-lg border border-primary-fixed text-center">
<span class="text-secondary font-body-md block mb-1">Your Token</span>
<span class="font-headline-lg-mobile md:font-headline-lg text-primary tracking-widest">4829-1039-5820-1102-394</span>
<button class="text-primary mt-2 flex items-center justify-center gap-1 mx-auto hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[16px]">content_copy</span>
<span class="font-label-sm">COPY</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 w-full">
<button class="bg-primary text-on-primary w-full py-4 rounded-lg font-headline-md hover:bg-tertiary-container transition-colors shadow-sm active:scale-95 duration-150 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">download</span>
                Download Receipt
            </button>
<button class="bg-transparent border border-primary text-primary w-full py-4 rounded-lg font-headline-md hover:bg-surface-container-low transition-colors active:scale-95 duration-150 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">calendar_month</span>
                Add to Calendar
            </button>
<a class="text-center mt-4 text-secondary hover:text-primary font-body-md transition-colors" href="#">Return to Home</a>
</div>
</main>
<!-- Bottom Nav Bar - Suppressed per rules for transactional/success screens -->
</body></html>
