<style>
        /* Custom Utilities for smooth scrolling and hiding scrollbars */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

            -ms-overflow-style: none;

            -webkit-tap-highlight-color: transparent;

<body class="bg-surface text-on-surface font-body-base antialiased pb-32">
<!-- TopNavBar (Mobile First Header) -->
<header class="bg-canvas-pure font-body-base text-body-base border-b border-surface-variant shadow-sm flex justify-between items-center w-full px-margin-mobile py-sm sticky top-0 z-50">
<div class="flex items-center gap-sm">
<h1 class="text-display-lg-mobile font-display-lg-mobile text-primary tracking-tight">NaijaShop</h1>
</div>
<div class="flex items-center gap-xs">
<button aria-label="Aura AI Voice Search" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<button aria-label="Language Toggle" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="language">language</span>
</button>
<button aria-label="Notifications" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full"></span>
</button>
</div>
</header>
<!-- Search Bar -->
<div class="px-margin-mobile py-sm bg-canvas-pure border-b border-surface-variant sticky top-[72px] z-40">
<div class="relative flex items-center w-full h-12 bg-surface-container-low rounded-full px-4 border border-outline-variant focus-within:border-primary transition-colors">
<span class="material-symbols-outlined text-secondary mr-2" data-icon="search">search</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-base font-body-base text-on-surface placeholder:text-secondary focus:outline-none" placeholder="Search products, brands..." type="text"/>
</div>
</div>
<!-- Category Chips (Horizontal Scroll) -->
<section class="py-md overflow-x-auto hide-scrollbar pl-margin-mobile">
<div class="flex gap-sm w-max pr-margin-mobile">
<button class="flex items-center gap-2 bg-primary-container text-on-primary-container px-4 py-2 rounded-full font-label-caps text-label-caps whitespace-nowrap">
<span class="material-symbols-outlined text-[18px]" data-icon="local_mall">local_mall</span>
                All

<button class="flex items-center gap-2 bg-surface-container-low text-on-surface-variant hover:bg-surface-variant transition-colors px-4 py-2 rounded-full font-label-caps text-label-caps border border-outline-variant whitespace-nowrap">
<span class="material-symbols-outlined text-[18px]" data-icon="checkroom">checkroom</span>
                Fashion
            </button>
<button class="flex items-center gap-2 bg-surface-container-low text-on-surface-variant hover:bg-surface-variant transition-colors px-4 py-2 rounded-full font-label-caps text-label-caps border border-outline-variant whitespace-nowrap">
<span class="material-symbols-outlined text-[18px]" data-icon="smartphone">smartphone</span>

<span class="material-symbols-outlined text-[18px]" data-icon="restaurant">restaurant</span>

<span class="material-symbols-outlined text-[18px]" data-icon="chair">chair</span>

</div>
</section>

<span class="font-label-caps text-label-caps text-on-surface-variant">Escrow Protected</span>
</div>
<button class="absolute top-2 right-2 w-10 h-10 bg-canvas-pure/90 backdrop-blur-sm rounded-full flex items-center justify-center text-secondary hover:text-error transition-colors shadow-sm">
<span class="material-symbols-outlined" data-icon="favorite">favorite</span>
</button>
</div>
<div class="p-md flex flex-col gap-sm">
<div>
<h3 class="font-body-bold text-body-bold text-on-surface line-clamp-1">Aura Tech Smartwatch Pro</h3>
<p class="font-body-base text-sm text-text-muted">Lagos, Nigeria • Verified Seller</p>
</div>
<div class="flex justify-between items-end mt-sm">

<button class="bg-secondary text-on-secondary px-6 py-2 rounded-lg font-body-bold text-sm h-[44px] flex items-center justify-center active:scale-95 transition-transform">

</div>
</div>
</article>

<div class="absolute top-2 left-2 bg-canvas-pure/90 backdrop-blur-sm px-2 py-1 rounded-full flex items-center gap-1 border border-outline-variant shadow-sm">
<span class="material-symbols-outlined text-trust-amber text-[14px]" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>

<button class="absolute top-2 right-2 w-10 h-10 bg-canvas-pure/90 backdrop-blur-sm rounded-full flex items-center justify-center text-secondary hover:text-error transition-colors shadow-sm">

</div>
<div class="p-md flex flex-col gap-sm">
<div>

<div class="flex justify-between items-end mt-sm">

<button class="bg-secondary text-on-secondary px-6 py-2 rounded-lg font-body-bold text-sm h-[44px] flex items-center justify-center active:scale-95 transition-transform">
                        Buy Now

</div>
</div>

</main>
<!-- Persistent Live Activity Bar (Order Status) -->
<div class="fixed bottom-[80px] left-margin-mobile right-margin-mobile bg-canvas-pure rounded-xl border border-surface-variant shadow-md p-3 flex items-center justify-between z-40">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
</div>
<div>
<p class="font-label-caps text-label-caps text-primary">ARRIVING IN 15 MINS</p>
<p class="font-body-bold text-sm text-on-surface">Order #NJA-8821</p>
</div>
</div>
<button class="text-secondary p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>

<nav class="bg-canvas-pure font-label-caps text-label-caps-mobile text-primary border-t border-surface-variant bg-canvas-pure/95 backdrop-blur-md shadow-[0_-2px_10px_rgba(0,0,0,0.05)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter-mobile pb-safe md:hidden h-16">

<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>

<button class="flex flex-col items-center justify-center text-secondary w-touch-target-min h-touch-target-min hover:bg-surface-container-highest/50 tap:scale-90 duration-150">
<span class="material-symbols-outlined mb-1" data-icon="grid_view">grid_view</span>
            Categories

<button class="flex flex-col items-center justify-center text-secondary w-touch-target-min h-touch-target-min hover:bg-surface-container-highest/50 tap:scale-90 duration-150">
<span class="material-symbols-outlined mb-1" data-icon="shopping_bag">shopping_bag</span>
            Orders

<button class="flex flex-col items-center justify-center text-secondary w-touch-target-min h-touch-target-min hover:bg-surface-container-highest/50 tap:scale-90 duration-150">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
            Wallet

<button class="flex flex-col items-center justify-center text-secondary w-touch-target-min h-touch-target-min hover:bg-surface-container-highest/50 tap:scale-90 duration-150">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
            Account

</nav>
