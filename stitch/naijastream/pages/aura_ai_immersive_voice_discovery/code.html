<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NaijaStream | Aura AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .aura-gradient {
            background: radial-gradient(circle at 50% 50%, #006d38 0%, #191c1e 70%);
            transition: background 0.5s ease;
        }
        .glass-chip {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

            theme: {

                    "colors": {
                        "on-secondary": "#ffffff",

                        "secondary-fixed-dim": "#c0c6db",
                        "trust-amber": "#F59E0B",
                        "surface-container-low": "#f3f4f6",
                        "surface": "#f8f9fb",
                        "canvas-pure": "#FFFFFF",
                        "surface-tint": "#006d38",
                        "on-primary-fixed": "#00210d",
                        "surface-container": "#edeef0",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#77fca3",
                        "on-surface-variant": "#3d4a3f",
                        "on-surface": "#191c1e",
                        "on-error-container": "#93000a",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "fontSize": {

<body class="bg-on-background h-screen overflow-hidden flex flex-col items-center justify-center font-body-base text-on-primary">
<!-- Top Navigation Anchor (Simulated context: No top bar to prioritize Canvas) -->
<!-- Aura Immersive Canvas -->
<div class="aura-gradient absolute inset-0 w-full h-full flex flex-col items-center justify-between py-12 px-6 z-0" id="aura-canvas">
<!-- Animated Background Element (Optional if no specific animation is provided, otherwise we'd use a shader) -->
<!-- Since no prompt placeholder was provided for animation, we simulate with CSS + Divs -->
<!-- Header Text -->
<div class="relative z-10 text-center space-y-2 mt-8">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary-fixed-dim drop-shadow-2xl">
                Aura is listening...
            </h1>
<p class="font-body-base text-secondary-fixed-dim opacity-80">
                Speak your vibe, discover your sound
            </p>
</div>
<!-- Central Visualization -->
<div class="relative w-full max-w-sm aspect-square flex items-center justify-center">
<!-- Pulsing Rings -->
<div class="absolute w-64 h-64 bg-primary-container rounded-full opacity-20 animate-pulse-ring"></div>
<div class="absolute w-48 h-48 bg-primary-container rounded-full opacity-40 animate-pulse-ring" style="animation-delay: 1s;"></div>
<!-- Voice Wave Visualizer -->
<div class="flex items-center justify-center gap-1.5 h-32 relative z-20">
<div class="wave-bar w-1.5 bg-primary-fixed h-4 rounded-full animate-bounce" style="animation-duration: 0.8s;"></div>
<div class="wave-bar w-1.5 bg-primary-fixed h-12 rounded-full animate-bounce" style="animation-duration: 1.1s;"></div>
<div class="wave-bar w-1.5 bg-primary-fixed h-24 rounded-full animate-bounce" style="animation-duration: 0.6s;"></div>
<div class="wave-bar w-1.5 bg-primary-fixed h-16 rounded-full animate-bounce" style="animation-duration: 0.9s;"></div>
<div class="wave-bar w-1.5 bg-primary-fixed h-28 rounded-full animate-bounce" style="animation-duration: 1.2s;"></div>
<div class="wave-bar w-1.5 bg-primary-fixed h-14 rounded-full animate-bounce" style="animation-duration: 0.7s;"></div>
<div class="wave-bar w-1.5 bg-primary-fixed h-20 rounded-full animate-bounce" style="animation-duration: 1.0s;"></div>
<div class="wave-bar w-1.5 bg-primary-fixed h-6 rounded-full animate-bounce" style="animation-duration: 0.5s;"></div>
</div>
<!-- Listening Icon Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-[64px] text-primary-fixed opacity-30 select-none">graphic_eq</span>
</div>
</div>
<!-- Suggestion Chips -->
<div class="w-full max-w-xl flex flex-wrap justify-center gap-3 relative z-10 px-4 mb-20">
<button class="glass-chip px-5 py-3 rounded-full flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined text-primary-fixed group-hover:scale-110 transition-transform">music_note</span>
<span class="font-body-bold text-white">Play the latest from Burna Boy</span>
</button>
<button class="glass-chip px-5 py-3 rounded-full flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined text-primary-fixed group-hover:scale-110 transition-transform">bolt</span>
<span class="font-body-bold text-white">Start an Amapiano mission</span>
</button>
<button class="glass-chip px-5 py-3 rounded-full flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined text-primary-fixed group-hover:scale-110 transition-transform">language</span>
<span class="font-body-bold text-white">Find top hits in Gabon</span>
</button>
<button class="glass-chip px-5 py-3 rounded-full flex items-center gap-2 hover:bg-white/10 active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined text-primary-fixed group-hover:scale-110 transition-transform">auto_awesome</span>
<span class="font-body-bold text-white">Surprise me</span>
</button>
</div>
</div>
<!-- Mandatory Bottom Navigation (Shell Fixed) -->
<!-- Active: Aura AI (matches "Aura AI" label in JSON) -->
<nav class="fixed bottom-0 left-0 w-full h-16 z-50 flex justify-around items-center px-margin-mobile pb-safe md:hidden bg-canvas-pure dark:bg-on-background shadow-[0_-4px_12px_rgba(0,0,0,0.05)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed relative after:content-[''] after:absolute after:-bottom-1 after:w-1 after:h-1 after:bg-primary after:rounded-full active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="mic_external_on" style="font-variation-settings: 'FILL' 1;">mic_external_on</span>
<span class="font-label-caps text-label-caps">Aura AI</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="library_music">library_music</span>
<span class="font-label-caps text-label-caps">My Music</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-caps text-label-caps">Wallet</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Account</span>
</a>
</nav>
<!-- Interactive script for ambient reactions -->
<script>
        const canvas = document.getElementById('aura-canvas');
        const bars = document.querySelectorAll('.wave-bar');
        
        // Randomly adjust bar heights to simulate voice activity
        setInterval(() => {
            bars.forEach(bar => {
                const height = Math.floor(Math.random() * 80) + 20;
                bar.style.height = `${height}px`;
            });

            // Pulse the background glow
            const glowIntensity = Math.floor(Math.random() * 20) + 10;
            canvas.style.background = `radial-gradient(circle at 50% 50%, #006d38 ${glowIntensity}%, #191c1e 80%)`;
        }, 150);

        // Simple vibration feedback simulation on interaction
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(20);
                }
            });
        });
    </script>
</body></html>
