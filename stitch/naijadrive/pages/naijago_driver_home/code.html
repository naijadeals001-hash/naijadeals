<!-- Interactive Layer Script -->
<script>
        const onlineBtn = document.getElementById('go-online-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const btnText = document.getElementById('btn-text');
        const subLabel = document.querySelector('.mt-3.font-label-caps');
        let isOnline = false;

        onlineBtn.addEventListener('click', () => {
            isOnline = !isOnline;
            if(isOnline) {
                onlineBtn.classList.replace('bg-primary', 'bg-security-crimson');
                btnText.textContent = 'Go Offline';
                statusIndicator.classList.replace('bg-white', 'bg-white');
                subLabel.textContent = 'YOU ARE NOW ACTIVE • READY FOR PICKUPS';
                subLabel.classList.replace('text-secondary', 'text-primary');
                // Pulse effect
                statusIndicator.classList.add('status-pulse');
            } else {
                onlineBtn.classList.replace('bg-security-crimson', 'bg-primary');
                btnText.textContent = 'Go Online';
                subLabel.textContent = 'YOU ARE CURRENTLY OFFLINE';
                subLabel.classList.replace('text-primary', 'text-secondary');
            }
        });
    </script>
