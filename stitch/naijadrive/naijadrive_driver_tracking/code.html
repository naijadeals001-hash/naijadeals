            content: '';
            position: absolute;
            width: 300%;
            height: 300%;
            background-color: #006d38;
            border-radius: 50%;
            animation: pulse-ring 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;

<body class="bg-background text-on-surface font-body-base overflow-hidden">

<!-- Animated Driver Marker -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
<div class="relative flex items-center justify-center pulse-animation">
<div class="w-8 h-8 bg-primary rounded-full border-4 border-canvas-pure shadow-lg z-10 flex items-center justify-center">
<span class="material-symbols-outlined text-canvas-pure text-[18px]" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
</div>
</div>
<!-- User/Destination Marker -->
<div class="absolute top-[40%] left-[45%]">
<div class="flex flex-col items-center">
<div class="bg-on-surface text-canvas-pure px-3 py-1 rounded-full text-[12px] font-bold mb-1 shadow-md">You</div>
<div class="w-3 h-3 bg-on-surface rounded-full border-2 border-canvas-pure"></div>
</div>
</div>
</div>
<!-- Top AppBar (JSON Driven Shell) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md px-margin-mobile h-touch-target-primary flex justify-between items-center">
<div class="flex items-center gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-headline-md text-[16px] leading-tight text-on-surface">Lagos, NG</span>
<span class="text-[12px] text-on-surface-variant font-medium">Tracking Driver</span>
</div>
</div>
<div class="flex gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-security-crimson-surface active:scale-95 transition-transform" title="Emergency SOS">
<span class="material-symbols-outlined text-security-crimson" style="font-variation-settings: 'FILL' 1;">sos</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</button>
</div>
</header>
<!-- Floating Action UI (Safety & Context) -->
<div class="fixed top-24 right-4 flex flex-col gap-3 z-40">
<button class="flex items-center gap-2 bg-canvas-pure px-4 py-3 rounded-xl shadow-sm border border-outline-variant/30 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">share</span>
<span class="font-label-caps text-on-surface">SHARE TRIP</span>
</button>
<button class="flex items-center gap-2 bg-canvas-pure px-4 py-3 rounded-xl shadow-sm border border-outline-variant/30 active:scale-95 transition-all">
<span class="material-symbols-outlined text-secondary">mic</span>
<span class="font-label-caps text-on-surface">RECORD</span>
</button>
</div>
<!-- Bottom Sheet Overlay -->
<div class="fixed bottom-0 left-0 w-full z-50 transition-transform duration-500 ease-out translate-y-0">
<div class="bg-canvas-pure rounded-t-[32px] shadow-[0_-8px_30px_rgba(0,0,0,0.08)] px-margin-mobile pb-10 pt-4 border-t border-outline-variant/20">
<!-- Handle -->
<div class="w-12 h-1.5 bg-surface-container-highest rounded-full mx-auto mb-6"></div>
<!-- ETA & Ride PIN Section -->
<div class="flex justify-between items-center mb-6">
<div>
<h2 class="font-display-lg-mobile text-primary">Arriving in 4 mins</h2>
<p class="text-on-surface-variant font-body-base">Driver is navigating heavy traffic</p>
</div>
<div class="bg-primary-container/10 border border-primary/20 px-4 py-2 rounded-2xl flex flex-col items-center">

<span class="font-price-display text-primary tracking-[0.2em] pin-digit">8824</span>

</div>

<div class="flex items-center gap-4">

<div class="absolute -bottom-1 -right-1 bg-trust-amber px-1.5 py-0.5 rounded-md flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-canvas-pure text-[12px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-canvas-pure text-[10px] font-bold">4.9</span>
</div>
</div>
<div>

<div class="flex items-center gap-2 mt-0.5">
<span class="text-on-surface-variant text-[14px]">Toyota Camry</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="bg-surface-container-highest px-2 py-0.5 rounded font-bold text-[12px] tracking-wider">ABC-123-LG</span>
</div>
</div>
</div>
<div class="flex flex-col items-end">
<div class="bg-primary-container px-3 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-on-primary-container text-[14px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="text-on-primary-container text-[11px] font-bold">LEGIT</span>
</div>
</div>
</div>
<!-- Quick Actions -->
<div class="grid grid-cols-2 gap-4">
<button class="h-touch-target-primary flex items-center justify-center gap-3 bg-canvas-pure border-2 border-outline-variant/30 rounded-xl font-body-bold text-on-surface active:scale-95 transition-all">
<span class="material-symbols-outlined text-secondary">chat_bubble</span>
                    Message
                </button>
<button class="h-touch-target-primary flex items-center justify-center gap-3 bg-primary text-canvas-pure rounded-xl font-body-bold active:scale-95 transition-all shadow-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call</span>
                    Call Driver
                </button>
</div>
</div>
</div>
<!-- Unified Bottom Bar (Suppressed on transactional focus, but here for structural completeness if requested by shell rules) -->
<!-- Note: Following the "Suppression" rule for Task-Focused screens with Close/Back actions. -->
<script>
        // Simple micro-interaction for the handle/bottom sheet
        let isExpanded = true;
        const sheet = document.querySelector('.fixed.bottom-0');
        
        // This is a decorative mock interaction
        document.querySelector('.w-12.h-1\\.5').addEventListener('click', () => {
            if(isExpanded) {
                sheet.style.transform = 'translateY(180px)';
            } else {
                sheet.style.transform = 'translateY(0)';
            }
            isExpanded = !isExpanded;
        });

        // Simulating slight movement for the driver marker
        let posX = 50;
        let posY = 50;
        const marker = document.querySelector('.pulse-animation').parentElement;
        
        setInterval(() => {
            posX += (Math.random() - 0.5) * 0.2;
            posY += (Math.random() - 0.5) * 0.2;
            marker.style.left = posX + '%';
            marker.style.top = posY + '%';
        }, 3000);
    </script>
</body></html>
