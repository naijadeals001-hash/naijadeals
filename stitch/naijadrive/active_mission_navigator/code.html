<!-- Emergency Floating Button (Domain Specific) -->
<div class="fixed left-md bottom-md z-50">
<button class="w-touch-target-min h-touch-target-min bg-security-crimson text-white rounded-full shadow-2xl flex items-center justify-center animate-pulse" onclick="alert('Emergency SOS Alert Sending...')">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sos</span>
</button>
</div>
<script>
        // Simple micro-interaction for PIN inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
        });

        // Background simulation of distance reduction
        let distance = 350;
        const distEl = document.querySelector('h2');
        setInterval(() => {
            if(distance > 10) {
                distance -= 2;
                distEl.innerText = `${distance}m — Right into Adeola Odeku`;
            }
        }, 3000);
    </script>
