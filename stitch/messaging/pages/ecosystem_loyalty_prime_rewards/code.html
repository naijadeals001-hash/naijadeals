<body class="bg-canvas-pure text-on-surface font-body-base min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="w-full sticky top-0 z-50 bg-canvas-pure shadow-sm">
<div class="flex justify-between items-center px-margin-mobile h-touch-target-primary">
<button class="text-on-surface hover:bg-surface-container-low transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center h-touch-target-min w-touch-target-min">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary font-extrabold tracking-tight"></h1>
<div class="w-touch-target-min"></div> <!-- Placeholder for balance -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-margin-mobile pt-sm pb-xl flex flex-col">
<!-- Page Title -->
<h2 class="font-display-lg-mobile text-display-lg-mobile font-extrabold mb-lg text-on-surface">Inbox</h2>
<!-- Filter Chips (Scrollable) -->
<div class="flex overflow-x-auto no-scrollbar gap-sm mb-lg pb-2 -mx-margin-mobile px-margin-mobile">
<button class="bg-on-surface text-canvas-pure px-4 py-2 rounded-full font-body-bold whitespace-nowrap h-touch-target-min flex items-center justify-center active:scale-95 transition-transform">
            All
        </button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-highest px-4 py-2 rounded-full font-body-bold whitespace-nowrap h-touch-target-min flex items-center justify-center transition-colors active:scale-95">
            Offers
        </button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-highest px-4 py-2 rounded-full font-body-bold whitespace-nowrap h-touch-target-min flex items-center justify-center transition-colors active:scale-95">
            Support
        </button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-highest px-4 py-2 rounded-full font-body-bold whitespace-nowrap h-touch-target-min flex items-center justify-center transition-colors active:scale-95">
            Updates
        </button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-highest px-4 py-2 rounded-full font-body-bold whitespace-nowrap h-touch-target-min flex items-center justify-center transition-colors active:scale-95">
            Prime
        </button>
</div>
<!-- Add Offer Code Input Area -->
<div class="bg-surface-container-low rounded-lg p-3 flex items-center mb-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-surface-variant">
<span class="material-symbols-outlined text-on-surface-variant mr-3" style="font-variation-settings: 'FILL' 1;">local_offer</span>
<input class="bg-transparent border-none outline-none flex-grow font-body-base text-on-surface placeholder:text-on-surface-variant focus:ring-0 p-0" placeholder="Add new offer code" type="text"/>
</div>
<!-- Empty State Container -->
<div class="flex-grow flex flex-col items-center justify-center text-center px-4 mt-xl">
<!-- Illustration Placeholder -->
<div class="relative w-32 h-32 mb-6 opacity-80">
<span class="material-symbols-outlined text-[100px] text-surface-variant absolute inset-0 flex items-center justify-center">mark_email_unread</span>
<span class="material-symbols-outlined text-[40px] text-primary absolute bottom-4 right-4 bg-canvas-pure rounded-full border-4 border-canvas-pure">notifications_off</span>
</div>
<h3 class="font-headline-md text-headline-md font-bold text-on-surface mb-2">No new messages</h3>
<p class="font-body-base text-body-base text-on-surface-variant mb-8 max-w-[280px]">
            Check back for offers and important notifications.
        </p>
<button class="bg-surface-container-high text-on-surface font-body-bold px-6 py-3 rounded-full h-touch-target-min hover:bg-surface-container-highest transition-colors active:scale-95 flex items-center justify-center">
