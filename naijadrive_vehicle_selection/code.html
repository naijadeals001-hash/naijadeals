<!-- Navigation Overlay logic - Suppression Check: Page is Transactional/Task-Focused. Global BottomNavBar is HIDDEN -->
<script>
        function selectVehicle(element) {
            // Remove active classes from all cards
            document.querySelectorAll('.vehicle-card').forEach(card => {
                card.classList.remove('border-primary');
                card.classList.add('border-transparent');
                card.querySelector('.text-primary')?.classList.replace('text-primary', 'text-on-surface');
            });

            // Add active classes to selected card
            element.classList.remove('border-transparent');
            element.classList.add('border-primary');
            const priceTag = element.querySelector('.font-price-display');
            priceTag.classList.replace('text-on-surface', 'text-primary');

            // Micro-interaction
            element.style.transform = 'scale(0.95)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 100);
        }

        // Add some subtle parallax/movement to the map for life
        document.addEventListener('mousemove', (e) => {
            const map = document.querySelector('img[data-location]');
            if (!map) return;
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            map.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
        });
    </script>
